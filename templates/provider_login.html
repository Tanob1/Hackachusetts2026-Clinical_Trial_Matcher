<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .login-container { max-width: 450px; margin: 100px auto; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="card">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">🏥 Provider Portal</h2>
                    <p class="text-center text-muted mb-4">Healthcare Provider Login</p>
                    
                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        {{ error }}
                    </div>
                    {% endif %}
                    
                    <form action="/provider/login" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                    </form>
                    
                    <hr>
                    
                    <div class="text-center">
                        <small class="text-muted">Demo Credentials</small><br>
                        <small>Email: <code>dr.smith@hospital.org</code></small><br>
                        <small>Password: <code>provider123</code></small>
                    </div>
                    
                    <div class="text-center mt-3">
                        <a href="/" class="btn btn-link btn-sm">← Back to Patient Portal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
